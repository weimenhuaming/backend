syntax = "proto3";

package core;
option go_package = "./core";

// 所有 RPC 方法统一定义在这里
service Core {
  // 测试接口
  rpc Test(TestRequest) returns (TestResponse);

  // Login 部分
  rpc Register(RegisterReq) returns (RegisterResp){};
  rpc EmailLogin(EmailLoginReq) returns (LoginResp){};
  rpc ResetPasswordByEmail(ResetPasswordEmailReq) returns (ResetPasswordEmailResp){};
  rpc Logout(LogoutReq) returns (LogoutResp){};

  // Category 部分
  rpc CreateCategory(CreateCategoryReq) returns (CreateCategoryResp){};  //  创建分类
  rpc ListCategories(ListCategoriesReq) returns (ListCategoriesResp){};  //  分类列表
  rpc DeleteCategory(DeleteCategoryReq) returns (DeleteCategoryResp){};  //  删除分类

  // Article 部分
  rpc CreateArticle(CreateArticleReq) returns (CreateArticleResp){};           // 创建文章
  rpc UpdateArticle(UpdateArticleReq) returns (UpdateArticleResp){};           // 更新文章
  rpc DeleteArticle(DeleteArticleReq) returns (DeleteArticleResp){};           // 删除文章
  rpc GetArticleDetail(GetArticleDetailReq) returns (GetArticleDetailResp){};  // 获取文章详情
  rpc ListArticles(ListArticlesReq) returns (ListArticlesResp){};              // 文章列表
  rpc SearchArticles(SearchArticlesReq) returns (SearchArticlesResp){};        // 搜索文章

  // interaction 部分
  rpc LikeArticle(LikeArticleReq) returns (LikeArticleResp){};                 // 点赞文章
  rpc FavorArticle(FavoriteArticleReq) returns (FavoriteArticleResp){};        // 收藏文章
  rpc LikeComment(LikeCommentReq) returns(LikeCommentResp){};

  // comment 部分
  rpc CreateComment(CreateCommentReq) returns(CreateCommentResp){};
  rpc CreateReply(CreateReplyReq) returns(CreateReplyResp){};
  rpc DeleteComment(DeleteCommentReq) returns(DeleteCommentResp){};
  rpc GetArticleComments(GetArticleCommentsReq) returns(GetArticleCommentsResp){};
  rpc GetCommentReplies(GetCommentRepliesReq) returns(GetCommentRepliesResp){};
  rpc GetUserComments(GetUserCommentsReq) returns(GetUserCommentsResp){};
}

// Test 接口的请求和响应消息
message TestRequest {
  string msg = 1;
}
message TestResponse {
  string reply = 1;
}

//======================================================================================================================
// 登入部分

message EmailLoginReq {
  // 属性的类型 属性名 = 标识符
  string email = 1;
  string captcha = 2;
}
message LoginResp {
  uint64 id = 1;
  string name =2;
  string phone = 3;
  string email = 4;
  string uuid = 5;
  string RefreshToken = 6;
  string AccessToken = 7;
  string avatar = 8;
  string role =9;
  string sex =10;
  uint64 age = 11;
}

message RegisterReq{
  string email=1;
  string password = 2;
  string name =3;
}
message RegisterResp{}

message ResetPasswordEmailReq{
  string email = 1;
  string password = 2; // 已由 gateway 做 bcrypt，core 仅落库
}
message ResetPasswordEmailResp{}

message LogoutReq{
  string  AccessToken = 1;
  string  RefreshToken = 2;
}
message LogoutResp{}

//======================================================================================================================
// 分类部分
message CreateCategoryReq {
  string name = 1;
}
message CreateCategoryResp {}

message CategoryInfo {
  uint64 id = 1;
  string name = 2;
}

message ListCategoriesReq {}
message ListCategoriesResp {
  repeated CategoryInfo categories = 1;
}

message DeleteCategoryReq {
  uint64 id = 1;
}
message DeleteCategoryResp {}

//======================================================================================================================
// 文章部分

// 文章信息结构
message ArticleInfo {
  uint64 id = 1;
  uint64 user_id = 2;
  uint64 category_id = 3;
  string title = 4;
  string summary = 5;
  string content = 6;
  string cover = 7;
  uint32 view_count = 8;
  uint32 like_count = 9;
  uint32 favor_count = 10;
  uint32 comment_count = 11;
  string created_at = 12;  // 创建时间
  string updated_at = 13;  // 更新时间
  // 作者信息（可根据需要扩展）
  string author_name = 14;
  string author_avatar = 15;
}

// 创建文章
message CreateArticleReq {
  uint64 category_id = 1;
  string title = 2;
  string summary = 3;
  string content = 4;
  string cover = 5;
  uint64 user_id = 6;
}
message CreateArticleResp {}

// 更新文章
message UpdateArticleReq {
  uint64 id = 1;                 // 文章ID
  uint64 category_id = 2;        // 分类ID（可选更新）
  string title = 3;              // 标题（可选更新）
  string summary = 4;            // 摘要（可选更新）
  string content = 5;            // 内容（可选更新）
  string cover = 6;              // 封面（可选更新）
}
message UpdateArticleResp {}

// 删除文章（软删除）
message DeleteArticleReq {
  uint64 id = 1;
  uint64 user_id=2;
}
message DeleteArticleResp {}

// 获取文章详情
message GetArticleDetailReq {
  uint64 id = 1;
}
message GetArticleDetailResp {
  ArticleInfo article = 1;
}

// 文章列表（支持分页和筛选）
message ListArticlesReq {
  uint32 page = 1;              // 页码，从1开始
  uint32 page_size = 2;         // 每页数量
  uint64 category_id = 3;       // 按分类筛选（0表示不筛选）
  uint64 user_id = 4;           // 按作者筛选（0表示不筛选）
  string sort_by = 5;           // 排序字段：created_at, view_count, like_count
  string sort_order = 6;        // 排序方式：asc, desc
}
message ListArticlesResp {
  repeated ArticleInfo articles = 1;
  uint32 total = 2;             // 总数量
  uint32 page = 3;              // 当前页码
  uint32 page_size = 4;         // 每页数量
}

// 搜索文章
message SearchArticlesReq {
  string keyword = 1;           // 搜索关键词（标题和内容）
  uint32 page = 2;              // 页码
  uint32 page_size = 3;         // 每页数量
  uint64 category_id = 4;       // 按分类筛选（0表示不筛选）
}
message SearchArticlesResp {
  repeated ArticleInfo articles = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

//======================================================================================================================
// 互动部分

// 点赞文章
message LikeArticleReq {
  uint64 article_id = 1;
  bool is_like = 2;             // true: 点赞, false: 取消点赞
}
message LikeArticleResp {
  uint32 like_count = 1;        // 返回最新点赞数
}

// 收藏文章
message FavoriteArticleReq {
  uint64 article_id = 1;
  bool is_favorite = 2;         // true: 收藏, false: 取消收藏
}
message FavoriteArticleResp {
  uint32 favor_count = 1;       // 返回最新收藏数
}

// 点赞评论
message LikeCommentReq {
  uint64 commentId = 1;    // 评论ID
  uint64 userId = 2;       // 用户ID
  bool isLike = 3;         // true=点赞，false=取消点赞
}
message LikeCommentResp {
  uint32 likeCount = 1;    // 最新的点赞数
}

//======================================================================================================================
// 评论部分

// 评论信息
message CommentInfo {
  uint64 id = 1;                      // 评论ID
  uint64 articleId = 2;               // 文章ID
  uint64 userId = 3;                  // 用户ID
  uint64 parentId = 4;                // 父评论ID（0=一级评论，非0=回复）
  uint64 rootId = 5;                  // 根评论ID（一级评论时=id，回复时=一级评论ID）
  uint64 replyToId = 6;               // 回复目标用户ID
  string replyToName = 7;             // 回复目标用户名
  string content = 8;                 // 评论内容
  uint32 likeCount = 9;               // 点赞数
  uint32 childCount = 10;             // 子评论数量（仅一级评论有效）
  string createdAt = 11;              // 创建时间
  string userName = 12;               // 用户名
  string userAvatar = 13;             // 用户头像
  repeated CommentInfo replies = 14;  // 回复列表（最多显示3条）
}

// 发表一级评论
message CreateCommentReq {
  uint64 articleId = 1;   // 文章ID
  uint64 userId = 2;      // 用户ID
  string content = 3;      // 评论内容
}
message CreateCommentResp {
  uint64 commentId = 1;    // 评论ID
}

// 发表回复（二级评论）
message CreateReplyReq {
  uint64 rootId = 1;       // 根评论ID（一级评论的ID）
  uint64 parentId = 2;     // 被回复的评论ID
  uint64 userId = 3;       // 用户ID
  uint64 replyToId = 4;    // 回复目标用户ID
  string replyToName = 5;  // 回复目标用户名
  string content = 6;      // 回复内容
}
message CreateReplyResp {
  uint64 replyId = 1;      // 回复ID
}

// 删除评论
message DeleteCommentReq {
  uint64 id = 1;           // 评论ID
}
message DeleteCommentResp {}

// 获取文章评论列表（只返回一级评论）
message GetArticleCommentsReq {
  uint64 articleId = 1;    // 文章ID
  int32 page = 2;          // 页码，默认1
  int32 size = 3;          // 每页条数，默认10
  string orderBy = 4;      // 排序方式：hot=热门，time=最新，默认time
}
message GetArticleCommentsResp {
  repeated CommentInfo comments = 1;  // 评论列表
  int32 page = 2;                      // 当前页
  int32 size = 3;                      // 每页条数
  int32 total = 4;                     // 总条数
}

// 获取评论的回复列表
message GetCommentRepliesReq {
  uint64 rootId = 1;       // 根评论ID（一级评论的ID）
  int32 page = 2;          // 页码，默认1
  int32 size = 3;          // 每页条数，默认10
}
message GetCommentRepliesResp {
  repeated CommentInfo replies = 1;   // 回复列表
  int32 page = 2;                      // 当前页
  int32 size = 3;                      // 每页条数
  int32 total = 4;                     // 总条数
}

// 获取用户的所有评论
message GetUserCommentsReq {
  uint64 userId = 1;       // 用户ID
  int32 page = 2;          // 页码，默认1
  int32 size = 3;          // 每页条数，默认10
}
message GetUserCommentsResp {
  repeated CommentInfo comments = 1;   // 评论列表
  int32 page = 2;                       // 当前页
  int32 size = 3;                       // 每页条数
  int32 total = 4;                      // 总条数
}