syntax = "proto3";

package core;
option go_package = "./core";

// 所有 RPC 方法统一定义在这里
service Core {
  // 测试接口
  rpc Test(TestRequest) returns (TestResponse);

  // Login 部分
  rpc Register(RegisterReq) returns (RegisterResp){};
  rpc EmailLogin(EmailLoginReq) returns (LoginResp){};
  rpc ResetPasswordByEmail(ResetPasswordEmailReq) returns (ResetPasswordEmailResp){};
  rpc Logout(LogoutReq) returns (LogoutResp){};

  // Category 部分
  rpc CreateCategory(CreateCategoryReq) returns (CreateCategoryResp){};  //  创建分类
  rpc ListCategories(ListCategoriesReq) returns (ListCategoriesResp){};  //  分类列表
  rpc DeleteCategory(DeleteCategoryReq) returns (DeleteCategoryResp){};  //  删除分类

  // Article 部分

}

// Test 接口的请求和响应消息
message TestRequest {
  string msg = 1;
}
message TestResponse {
  string reply = 1;
}

//======================================================================================================================
// 登入部分

message EmailLoginReq {
  // 属性的类型 属性名 = 标识符
  string email = 1;
  string captcha = 2;
}
message LoginResp {
  uint64 id = 1;
  string name =2;
  string phone = 3;
  string email = 4;
  string uuid = 5;
  string RefreshToken = 6;
  string AccessToken = 7;
  string avatar = 8;
  string role =9;
  string sex =10;
  uint64 age = 11;
}

message RegisterReq{
  string email=1;
  string password = 2;
  string name =3;
}
message RegisterResp{}

message ResetPasswordEmailReq{
  string email = 1;
  string password = 2; // 已由 gateway 做 bcrypt，core 仅落库
  string captcha = 3; // 已废弃：验证码仅在 gateway 校验，保留字段兼容旧客户端
}
message ResetPasswordEmailResp{}

message LogoutReq{
  string  AccessToken = 1;
  string  RefreshToken = 2;
}
message LogoutResp{}

//======================================================================================================================
// 分类部分
message CreateCategoryReq {
  string name = 1;
}
message CreateCategoryResp {}

message CategoryInfo {
  uint64 id = 1;
  string name = 2;
}

message ListCategoriesReq {}
message ListCategoriesResp {
  repeated CategoryInfo categories = 1;
}

message DeleteCategoryReq {
  uint64 id = 1;
}
message DeleteCategoryResp {}

//======================================================================================================================
// 文章部分