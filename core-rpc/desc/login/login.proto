syntax = "proto3"; //指定版本

package core;
// 包名
option go_package = "./pb";

// 定义服务名
service Core {
  rpc Register(RegisterReq) returns (RegisterResp){};   //   注册
  rpc EmailLogin(EmailLoginReq) returns (LoginResp){};  //   邮箱登入
  rpc ResetPasswordByEmail(ResetPasswordEmailReq) returns (ResetPasswordEmailResp){};  //  忘记密码
  rpc Logout(LogoutReq) returns (LogoutResp){};       //  登出
}

// =====================================================================================================================

message EmailLoginReq {
  // 属性的类型 属性名 = 标识符
  string email = 1;
  string captcha = 2;
}
message LoginResp {
  uint64 id = 1;
  string name =2;
  string phone = 3;
  string email = 4;
  string uuid = 5;
  string RefreshToken = 6;
  string AccessToken = 7;
  string avatar = 8;
  string role =9;
  string sex =10;
  uint64 age = 11;
}

message RegisterReq{
  string email=1;
  string password = 2;
  string captcha =3;
  string name =4;
}
message RegisterResp{}

message ResetPasswordEmailReq{
  string email = 1;
  string password = 2; // 已由 gateway 做 bcrypt，core 仅落库
  string captcha = 3; // 已废弃：验证码仅在 gateway 校验，保留字段兼容旧客户端
}
message ResetPasswordEmailResp{}

message LogoutReq{
  string  AccessToken = 1;
  string  RefreshToken = 2;
}
message LogoutResp{}





