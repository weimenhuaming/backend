version: "3.7"
services:
  elasticsearch:
#    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
    build: ./elasticseach
    container_name: elasticsearch
    restart: no
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    volumes:
      - D:\Docker\elasticsearch9.3.3:/usr/share/elasticsearch/data
#      - ./elasticsearch-plugin:/usr/share/elasticsearch/plugins
    ports:
      - 9200:9200

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:9.3.3
    restart: no
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - 5601:5601
    depends_on:
      - elasticsearch