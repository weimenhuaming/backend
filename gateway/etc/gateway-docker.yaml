Name: Gateway
Host: 0.0.0.0
Port: 9000

Log:
  Stat: false

Timeout: 120000  # HTTP 超时（毫秒），Agent 问答需较长时间

CoreRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: core.rpc

AgentRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: agent.rpc
  Timeout: 120000  # gRPC 超时（毫秒），RAG + LLM 调用较慢

Cache:
  - Host: redis:6379
    Type: node
    Pass: "${REDIS_PASSWORD}"

Auth:
  AccessSecret: "your-256-bit-secret"
  AccessExpire: 3000
RefreshSecret: "another-random-secret"
RefreshExpire: 604800