Name: agent.rpc
ListenOn: 0.0.0.0:8081
Etcd:
  Hosts:
    - etcd:2379
  Key: agent.rpc


Timeout: 120000  # gRPC 超时（毫秒），RAG + LLM 调用较慢

Cache:
  - Host: redis:6379
    Type: node
    Pass: "${REDIS_PASSWORD}"

# 个人知识库 Agent（langchaingo RAG）
KnowledgeBase:
  DataPath: ./data/knowledge
  TopK: 4
  ChunkSize: 800
  ChunkOverlap: 100
  Chroma:
    URL: http://chroma:8000
    Collection: chenaqi_knowledge
  Memory:
    WindowTurns: 5
    SessionTTL: 1800
  LLM:
    # 对话模型：智谱（OpenAI 兼容）
    Provider: openai
    BaseURL: https://open.bigmodel.cn/api/paas/v4
    APIKey: ${LLMAPIKEY}
    Model: glm-4v-flash
  Embedding:
    # 目前支持 Ollama 和 aliyun
    Provider: aliyun
    BaseURL: https://dashscope.aliyuncs.com/api/v1/services/embeddings/multimodal-embedding/multimodal-embedding
    APIKey: ${DASHSCOPE_API_KEY}
    Model: qwen3-vl-embedding
    Dimension: 1024
