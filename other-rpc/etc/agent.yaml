Name: agent.rpc
ListenOn: 127.0.0.1:8081
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: agent.rpc

Timeout: 120000  # gRPC 超时（毫秒），RAG + LLM 调用较慢

KnowledgeBase:
  DataPath: ./data/knowledge
  TopK: 4
  ChunkSize: 800
  ChunkOverlap: 100
  MemoryWindowTurns: 3
  MemorySessionTTL: 900
  Chroma:
    URL: http://127.0.0.1:8000
    Collection: chenaqi_knowledge
  LLM:
    # 对话模型：智谱（OpenAI 兼容）
    Provider: openai
    BaseURL: https://open.bigmodel.cn/api/paas/v4
    APIKey: ${LLMAPIKEY}
    Model: glm-4v-flash
  Embedding:
    # 向量模型：阿里云百炼 qwen3-vl-embedding（以下字段均为必填）
    Provider: aliyun
    BaseURL: https://dashscope.aliyuncs.com/api/v1/services/embeddings/multimodal-embedding/multimodal-embedding
    APIKey: ${DASHSCOPE_API_KEY}
    Model: qwen3-vl-embedding
    Dimension: 1024
